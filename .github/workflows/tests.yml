name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install numpy soundfile pypdf python-pptx python-docx pytest
      - run: python -X warn_default_encoding -W error::EncodingWarning -m pytest -q tests
  web:
    # the phone app (web/) in a real Chromium, and its package checks in node: here they must run, not be skipped
    runs-on: ubuntu-latest
    env:
      S2S_EXIGIR_NAVEGADOR: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: python -m pip install numpy soundfile pypdf python-pptx python-docx pytest playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -X warn_default_encoding -W error::EncodingWarning -m pytest -q -rs tests/test_app_web.py tests/test_paquete.py tests/test_sitio.py tests/test_progreso.py
