name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install numpy soundfile pypdf pytest
      - run: python -X warn_default_encoding -W error::EncodingWarning -m pytest -q tests
