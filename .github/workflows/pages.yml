name: pages
# Publishes the phone app (web/ + progreso.js + cuestionario.js) to GitHub Pages. It is only the empty player: the
# videos are imported on each phone and never uploaded.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "skills/scroll-to-study/scripts/progreso.js"
      - "skills/scroll-to-study/scripts/cuestionario.js"
      - "tools/sitio.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python tools/sitio.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
